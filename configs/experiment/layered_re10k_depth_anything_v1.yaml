# @package _global_
# Depth Anything V1 (official relative depth) on RE10K with the standard CUDA
# rasterizer.  Use ``layered_re10k_npu`` for the Ascend single-card path.
config:
  exp_name: layered_re10k_depth_anything_v1

defaults:
  - override /dataset: re10k
  - override /model: gaussian
  - override /model/depth: depth_anything_v1
  - override /loss: [regularization, reconstruction]

model:
  name: depth_anything_v1
  gauss_novel_frames: [-1, 1, 2]
  renderer_w_pose: true
  scale_with_depth: false
  opacity_scale: 1.0
  depth_scale: 0.1
  xyz_scale: 0.2
  max_depth: 20
  depth_cond: true

train:
  # Required for the V1 relative-depth prior: recover absolute scale from the
  # sparse COLMAP point cloud instead of trusting V1's [0, 1] normalisation.
  scale_pose_by_depth: true
  use_gt_poses: true
